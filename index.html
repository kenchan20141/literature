<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文學人作品集 &bull; Archivum Litterarum</title>
  
  <!-- 字型加載：古典羅馬字體 Cinzel、古典襯線 Cormorant 與 思源宋體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-parchment: #F5EFEB;
      --gold-primary: #C5A059;
      --gold-light: #E8D39E;
      --gold-dark: #8C6D37;
      --ink-primary: #1A1412;
      --ink-light: #4A3E37;
      --ink-faint: #7D6F66;
      --border-gold: rgba(197, 160, 89, 0.45);
      --transition-smooth: cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-parchment);
      color: var(--ink-primary);
      font-family: 'Noto Serif TC', 'Cormorant Garamond', serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* 羊皮紙底紋漸層 */
    .parchment-layer {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 40%, rgba(255, 253, 248, 0.7) 0%, rgba(240, 230, 214, 0.8) 60%, rgba(215, 196, 170, 0.95) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 紙質顆粒紋理 */
    .paper-noise {
      position: fixed;
      inset: 0;
      opacity: 0.28;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    /* 金粉光斑 Canvas */
    #goldDustCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* 古典金色外框 */
    .antique-frame {
      position: fixed;
      inset: 14px;
      border: 1px solid var(--border-gold);
      pointer-events: none;
      z-index: 10;
    }
    .antique-frame-inner {
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(197, 160, 89, 0.2);
    }

    /* 四角復古花飾 */
    .corner-flourish {
      position: absolute;
      width: 64px;
      height: 64px;
      fill: none;
      stroke: var(--gold-primary);
      stroke-width: 1.5;
    }
    .top-left { top: -2px; left: -2px; }
    .top-right { top: -2px; right: -2px; transform: scaleX(-1); }
    .bottom-left { bottom: -2px; left: -2px; transform: scaleY(-1); }
    .bottom-right { bottom: -2px; right: -2px; transform: scale(-1); }

    /* ========================================================
       未登入學校帳號時的古典提醒橫幅 (Banner)
       ======================================================== */
    .auth-banner {
      display: none;
      position: relative;
      z-index: 20;
      background: rgba(245, 239, 235, 0.95);
      border: 1px solid var(--gold-primary);
      box-shadow: 0 4px 20px rgba(140, 109, 55, 0.15);
      padding: 10px 24px;
      margin: 14px auto 0;
      max-width: 900px;
      border-radius: 3px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.6s ease;
    }
    .auth-banner.visible {
      display: flex;
    }
    .auth-banner-text {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--ink-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auth-banner-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-school-auth {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: #fff;
      background: var(--gold-dark);
      border: 1px solid var(--gold-primary);
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.3s;
      white-space: nowrap;
    }
    .btn-school-auth:hover {
      background: var(--gold-primary);
      box-shadow: 0 2px 8px rgba(197, 160, 89, 0.4);
    }
    .banner-close-btn {
      background: transparent;
      border: none;
      font-size: 18px;
      color: var(--ink-faint);
      cursor: pointer;
      padding: 0 4px;
    }

    /* 主舞台版面 */
    .viewport-container {
      position: relative;
      z-index: 5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 24px 20px;
    }

    /* ========================================================
       Hero Header 設計
       ======================================================== */
    .hero-header {
      text-align: center;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .main-title-chinese {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(24px, 3.5vw, 42px);
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--ink-primary);
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .title-highlight {
      color: var(--gold-dark);
    }

    .sub-title-latin {
      font-family: 'Cinzel', serif;
      font-size: clamp(11px, 1.2vw, 13px);
      letter-spacing: 0.5em;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }

    .header-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 400px;
    }
    .header-divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
    }
    .header-divider .diamond {
      color: var(--gold-primary);
      font-size: 10px;
    }

    /* ========================================================
       角色展示廊
       ======================================================== */
    .characters-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.8vw, 22px);
      padding: 24px 0 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    /* 角色卡片 */
    .char-card {
      position: relative;
      flex: 1;
      max-width: 215px;
      height: clamp(400px, 60vh, 560px);
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(235,223,205,0.5) 100%);
      border: 1px solid var(--border-gold);
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 10px;
      transition: transform 0.5s var(--transition-smooth), box-shadow 0.5s var(--transition-smooth), border-color 0.4s;
      overflow: hidden;
    }

    .char-card::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(197, 160, 89, 0.2);
      border-radius: 2px;
      pointer-events: none;
      z-index: 3;
    }

    .char-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold-primary);
      box-shadow: 0 16px 36px rgba(140, 109, 55, 0.2), 0 0 16px rgba(232, 211, 158, 0.4);
    }

    /* 角色影像 */
    .char-visual {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 84%;
      background-image: url('https://lh3.googleusercontent.com/d/1pPd61CjmQpCXUKLwPoKLV6EXoZia8e60');
      background-repeat: no-repeat;
      background-size: 615% auto;
      background-position-y: 50% !important;
      transition: transform 0.6s var(--transition-smooth), filter 0.4s;
      filter: sepia(0.08) contrast(1.02);
      z-index: 1;
    }

    /* 6 位角色水平定位 */
    .char-card[data-index="0"] .char-visual { background-position-x: 7.5%; }
    .char-card[data-index="1"] .char-visual { background-position-x: 25.5%; }
    .char-card[data-index="2"] .char-visual { background-position-x: 43%; }
    .char-card[data-index="3"] .char-visual { background-position-x: 59%; }
    .char-card[data-index="4"] .char-visual { background-position-x: 76.5%; }
    .char-card[data-index="5"] .char-visual { background-position-x: 94.5%; }

    .char-card:hover .char-visual {
      transform: scale(1.04);
      filter: sepia(0) contrast(1.05);
    }

    /* 未登入學校帳號時的角色立繪優雅後備層 */
    .card-auth-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 84%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      text-align: center;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.7) 0%, rgba(235,223,205,0.85) 100%);
      z-index: 2;
    }

    body.needs-school-auth .card-auth-fallback { display: flex; }
    body.needs-school-auth .char-visual { display: none; }

    .fallback-seal {
      width: 48px;
      height: 48px;
      border: 1px dashed var(--gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--gold-dark);
      background: rgba(255, 255, 255, 0.4);
    }
    .fallback-title {
      font-size: 13px;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: var(--gold-dark);
      margin-bottom: 4px;
    }
    .fallback-desc {
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .btn-card-login {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--gold-primary);
      color: var(--ink-primary);
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
    }
    .btn-card-login:hover {
      background: var(--gold-dark);
      color: #fff;
      border-color: var(--gold-dark);
      transform: translateY(-2px);
    }

    .char-gradient-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(238, 226, 209, 0.96) 16%, rgba(238, 226, 209, 0.2) 36%, transparent 60%);
      pointer-events: none;
      z-index: 2;
    }

    .char-meta {
      position: relative;
      z-index: 4;
      text-align: center;
    }
    .char-numeral {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--gold-dark);
      display: block;
      margin-bottom: 3px;
    }
    .char-name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--ink-primary);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .char-name.is-empty {
      color: var(--ink-faint);
      font-style: italic;
      font-weight: 400;
      font-size: 13px;
    }
    .char-tag {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    footer {
      text-align: center;
      padding-bottom: 6px;
    }
    .enter-cue {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.4em;
      color: var(--gold-dark);
      text-transform: uppercase;
      opacity: 0.85;
    }

    /* ========================================================
       個人作品集 手稿視窗
       ======================================================== */
    .portfolio-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 14, 12, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      padding: 30px;
    }
    .portfolio-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .manuscript-book {
      position: relative;
      width: 100%;
      max-width: 1024px;
      height: 88vh;
      background: var(--bg-parchment);
      border: 1px solid var(--gold-primary);
      border-radius: 2px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 0 120px rgba(180, 150, 110, 0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.97) translateY(20px);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .portfolio-overlay.active .manuscript-book {
      transform: scale(1) translateY(0);
    }

    .modal-char-bg-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .modal-char-bg {
      height: 120%;
      aspect-ratio: 1 / 1.5;
      background-image: url('https://lh3.googleusercontent.com/d/1pPd61CjmQpCXUKLwPoKLV6EXoZia8e60');
      background-size: 615% auto;
      background-repeat: no-repeat;
      background-position-y: 50%;
      opacity: 0.15; 
      filter: sepia(0.3) contrast(1.1) grayscale(0.1);
      transition: background-position 0s;
    }

    .modal-content-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .book-flourish {
      position: absolute;
      width: 56px;
      height: 56px;
      fill: none;
      stroke: var(--gold-primary);
      stroke-width: 1.2;
      pointer-events: none;
      z-index: 15;
    }

    .btn-close {
      position: absolute;
      top: 24px;
      right: 24px;
      background: transparent;
      border: 1px solid rgba(197, 160, 89, 0.4);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      stroke: var(--gold-dark);
      transition: all 0.4s ease;
      z-index: 20;
    }
    .btn-close:hover {
      border-color: var(--gold-dark);
      background: rgba(197, 160, 89, 0.1);
      transform: rotate(90deg);
    }

    .modal-header-area {
      background: linear-gradient(to bottom, rgba(245, 239, 235, 1) 0%, rgba(245, 239, 235, 0.95) 60%, rgba(245, 239, 235, 0) 100%);
      padding-top: 50px;
      position: relative;
      z-index: 10;
    }
    .book-header {
      padding: 0 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .book-author-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }
    .book-author-name {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: var(--gold-dark);
      text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }
    .book-author-divider {
      width: 40px;
      height: 1px;
      background: var(--gold-primary);
    }
    .book-author-genre {
      font-size: 13px;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      color: var(--ink-faint);
    }

    .genre-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0 20px;
      gap: 45px;
    }
    .genre-tab {
      background: transparent;
      border: none;
      font-size: 14px;
      letter-spacing: 0.4em;
      text-indent: 0.4em;
      color: var(--ink-faint);
      cursor: pointer;
      font-family: inherit;
      position: relative;
      padding: 10px 0;
      transition: color 0.3s;
    }
    .genre-tab::after {
      content: '♦';
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(197, 160, 89, 0.4);
      font-size: 10px;
    }
    .genre-tab:last-child::after {
      content: '';
    }
    .genre-tab:hover {
      color: var(--ink-primary);
    }
    .genre-tab.active {
      color: var(--gold-dark);
      font-weight: 600;
    }
    .genre-tab.active::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 1px;
      background: var(--gold-dark);
    }

    .book-body {
      flex: 1;
      padding: 10px 36px 60px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-primary) transparent;
      position: relative;
    }

    .content-plate {
      background: rgba(252, 249, 245, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(197, 160, 89, 0.25);
      box-shadow: 0 15px 40px rgba(140, 109, 55, 0.06), inset 0 0 30px rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      max-width: 760px;
      margin: 0 auto;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      text-align: center;
      gap: 20px;
      padding: 40px;
    }
    .empty-symbol {
      width: 40px;
      height: 1px;
      background: var(--gold-primary);
      opacity: 0.5;
    }
    .empty-text {
      font-size: 14px;
      letter-spacing: 0.4em;
      color: var(--ink-faint);
      font-style: italic;
    }

    .works-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 40px;
    }

    .work-item {
      width: 100%;
      background: transparent;
      border: none;
      padding: 30px 20px;
      cursor: pointer;
      text-align: center;
      position: relative;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .work-item:hover {
      opacity: 0.7;
      transform: translateY(-2px);
    }
    .work-item::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: rgba(197, 160, 89, 0.3);
      margin: 30px auto -30px; 
    }
    .work-item:last-child::after {
      display: none;
    }

    .work-numeral {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 16px;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
    }
    .work-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-indent: 0.25em;
      color: var(--ink-primary);
    }

    .manuscript-reader {
      display: none;
      animation: fadeInReader 0.6s ease;
      padding: 50px 60px;
    }
    .manuscript-reader.active {
      display: block;
      background: rgba(252, 249, 245, 0.85); 
    }
    .reader-top-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    .reader-back {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: var(--gold-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: none;
      font-family: inherit;
      padding: 8px 16px;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .reader-back:hover {
      border-color: rgba(197, 160, 89, 0.4);
      background: rgba(197, 160, 89, 0.08);
      border-radius: 20px;
    }
    
    .reader-header {
      text-align: center;
      margin-bottom: 50px;
    }
    .reader-ornament {
      color: var(--gold-light);
      font-size: 20px;
      margin-bottom: 20px;
      font-family: 'Cinzel', serif;
    }
    .reader-title {
      font-size: 32px;
      letter-spacing: 0.25em;
      text-indent: 0.25em;
      color: var(--ink-primary);
      margin-bottom: 12px;
    }
    .reader-subtitle {
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--gold-dark);
    }
    
    .reader-content {
      font-size: 16px;
      line-height: 42px; 
      color: var(--ink-primary);
      text-align: justify;
      white-space: pre-line;
      padding: 0 20px;
      
      background-image: linear-gradient(
        to bottom,
        transparent 41px, 
        rgba(197, 160, 89, 0.35) 41px,
        rgba(197, 160, 89, 0.35) 42px
      );
      background-size: 100% 42px; 
      background-position: 0 0; 
    }
    .reader-content::first-letter {
      font-size: 42px;
      color: var(--gold-dark);
      font-weight: 700;
      margin-right: 4px;
      line-height: 1; 
      vertical-align: -10%;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInReader {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 860px) {
      .auth-banner {
        flex-direction: column;
        text-align: center;
      }
      .main-title-chinese {
        font-size: 26px;
      }
      .characters-stage {
        overflow-x: auto;
        justify-content: flex-start;
        padding: 20px 0;
        scroll-snap-type: x mandatory;
      }
      .char-card {
        flex: 0 0 205px;
        height: 440px;
        scroll-snap-align: center;
      }
      .char-card:first-child {
        margin-left: calc(50% - 102.5px);
      }
      .char-card:last-child {
        margin-right: calc(50% - 102.5px);
      }
      .modal-header-area {
        padding-top: 30px;
      }
      .book-header {
        padding: 0 20px 16px;
      }
      .book-author-name {
        font-size: 24px;
      }
      .btn-close {
        top: 16px;
        right: 16px;
      }
      .genre-nav {
        gap: 20px;
      }
      .genre-tab {
        font-size: 13px;
      }
      .genre-tab::after {
        right: -14px;
      }
      .book-body {
        padding: 10px 16px 30px;
      }
      .works-grid, .manuscript-reader {
        padding: 20px;
      }
      .work-title {
        font-size: 20px;
      }
      .reader-title {
        font-size: 26px;
      }
      .reader-content {
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <div class="parchment-layer"></div>
  <div class="paper-noise"></div>
  <canvas id="goldDustCanvas"></canvas>

  <div class="antique-frame">
    <div class="antique-frame-inner"></div>
    <svg class="corner-flourish top-left" viewBox="0 0 100 100"><path d="M4 96 V 24 C 4 12, 12 4, 24 4 H 96 M12 96 V 30 C 12 20, 20 12, 30 12 H 96"/><circle cx="28" cy="28" r="4" fill="var(--gold-primary)"/></svg>
    <svg class="corner-flourish top-right" viewBox="0 0 100 100"><path d="M4 96 V 24 C 4 12, 12 4, 24 4 H 96 M12 96 V 30 C 12 20, 20 12, 30 12 H 96"/><circle cx="28" cy="28" r="4" fill="var(--gold-primary)"/></svg>
    <svg class="corner-flourish bottom-left" viewBox="0 0 100 100"><path d="M4 96 V 24 C 4 12, 12 4, 24 4 H 96 M12 96 V 30 C 12 20, 20 12, 30 12 H 96"/><circle cx="28" cy="28" r="4" fill="var(--gold-primary)"/></svg>
    <svg class="corner-flourish bottom-right" viewBox="0 0 100 100"><path d="M4 96 V 24 C 4 12, 12 4, 24 4 H 96 M12 96 V 30 C 12 20, 20 12, 30 12 H 96"/><circle cx="28" cy="28" r="4" fill="var(--gold-primary)"/></svg>
  </div>

  <div class="viewport-container">
    
    <header class="hero-header">
      <h1 class="main-title-chinese"><span class="title-highlight">文學人</span> 作品集</h1>
      <h2 class="sub-title-latin">ARCHIVUM LITTERARUM</h2>
      
      <div class="header-divider">
        <span class="line"></span>
        <span class="diamond">♦</span>
        <span class="line"></span>
      </div>
    </header>

    <aside class="auth-banner" id="authBanner" aria-live="polite">
      <div class="auth-banner-text">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold-dark)" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>作品集立繪受校園權限保護；若角色未顯示，請切換至學校 Google 電郵。</span>
      </div>
      <div class="auth-banner-actions">
        <button class="btn-school-auth" onclick="switchSchoolAccount()">切換學校電郵登入</button>
        <button class="banner-close-btn" onclick="dismissBanner()" title="關閉提示">&times;</button>
      </div>
    </aside>

    <!-- 密碼輸入區段 (驗證成功前顯示) -->
    <section id="pwd-section" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; animation: fadeIn 0.8s ease;">
      <div style="text-align: center; margin-bottom: 30px;">
        <h3 style="font-family: 'Noto Serif TC', serif; font-size: 20px; letter-spacing: 0.4em; text-indent: 0.4em; color: var(--ink-primary); font-weight: 600; margin-bottom: 12px;">請輸入閱覽密語</h3>
        <p style="font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.3em; color: var(--gold-dark);">AUTHORIZATION</p>
      </div>
      <input type="password" id="pwd-input" placeholder="· · ·" autofocus autocomplete="off" spellcheck="false"
             style="background: transparent; border: none; border-bottom: 1px solid var(--gold-primary); color: var(--ink-primary); font-size: 36px; text-align: center; outline: none; width: 320px; font-family: 'Cinzel', serif; letter-spacing: 0.3em; padding-bottom: 12px; border-radius: 0; transition: border-color 0.3s; box-shadow: none;">
    </section>

    <!-- 角色展示廊 (驗證成功後顯示) -->
    <main class="characters-stage" id="charactersStage" style="display: none;"></main>

    <footer>
      <p class="enter-cue">&mdash; 點 擊 卷 冊 閱 讀 創 作 &mdash;</p>
    </footer>
  </div>

  <div class="portfolio-overlay" id="portfolioOverlay">
    <div class="manuscript-book">
      
      <div class="modal-char-bg-container">
        <div class="modal-char-bg" id="modalCharBg"></div>
      </div>

      <div class="modal-content-wrapper">
        <svg class="book-flourish top-left" viewBox="0 0 60 60"><path d="M2 58 V16 A14 14 0 0 1 16 2 H58"/></svg>
        <svg class="book-flourish top-right" viewBox="0 0 60 60" style="transform: scaleX(-1);"><path d="M2 58 V16 A14 14 0 0 1 16 2 H58"/></svg>

        <button class="btn-close" id="btnCloseModal" title="闔上手稿">
          <svg width="16" height="16" viewBox="0 0 14 14" stroke-width="1.5">
            <line x1="1" y1="1" x2="13" y2="13" />
            <line x1="13" y1="1" x2="1" y2="13" />
          </svg>
        </button>

        <div class="modal-header-area">
          <div class="book-header">
            <div class="book-author-info">
              <h2 class="book-author-name" id="modalAuthorName">學生姓名</h2>
              <div class="book-author-divider"></div>
              <span class="book-author-genre" id="modalAuthorGenre">文學方向</span>
            </div>
          </div>

          <nav class="genre-nav">
            <button class="genre-tab active" data-genre="poetry">詩 歌</button>
            <button class="genre-tab" data-genre="novel">小 說</button>
            <button class="genre-tab" data-genre="prose">散 文</button>
          </nav>
        </div>

        <div class="book-body">
          
          <div id="worksListContainer">
            <div class="works-grid content-plate" id="worksGrid"></div>
          </div>

          <div class="manuscript-reader content-plate" id="manuscriptReader">
            <div class="reader-top-bar">
              <button class="reader-back" id="btnReaderBack">
                <svg width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M8 2 L4 6 L8 10"/>
                </svg>
                闔 上 篇 目
              </button>
            </div>
            <div class="reader-header">
              <div class="reader-ornament">❦</div>
              <h3 class="reader-title" id="readerTitle">篇目名</h3>
              <p class="reader-subtitle" id="readerSubtitle">體裁與題註</p>
            </div>
            <div class="reader-content" id="readerContent"></div>
          </div>
          
        </div>
      </div>
      
    </div>
  </div>

  <script>
    // --- 密碼解鎖與 LocalStorage 邏輯 ---
    document.getElementById('pwd-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        try {
          if (btoa(this.value) === 'aWxvdmVjaGlsaXQ=') {
            // 寫入 LocalStorage，記住驗證狀態
            localStorage.setItem('archivum_auth', 'true');
            
            const pwdSec = document.getElementById('pwd-section');
            const charStage = document.getElementById('charactersStage');
            
            pwdSec.style.transition = 'opacity 0.6s ease';
            pwdSec.style.opacity = '0';
            
            setTimeout(() => {
              pwdSec.style.display = 'none';
              charStage.style.display = '';
              charStage.style.animation = 'fadeIn 0.8s ease';
              scrollToRandomCharacter();
            }, 600);
          } else {
            throw new Error();
          }
        } catch (err) {
          this.value = '';
          this.placeholder = '× × ×';
          setTimeout(() => this.placeholder = '· · ·', 1000);
        }
      }
    });

    const GOOGLE_DRIVE_FILE_ID = "1pPd61CjmQpCXUKLwPoKLV6EXoZia8e60";
    const DIRECT_IMG_URL = `https://lh3.googleusercontent.com/d/${GOOGLE_DRIVE_FILE_ID}`;
    
    function switchSchoolAccount() {
      const authUrl = `https://accounts.google.com/AccountChooser?continue=https://drive.google.com/file/d/${GOOGLE_DRIVE_FILE_ID}/view`;
      window.open(authUrl, '_blank', 'noopener,noreferrer');
    }

    function dismissBanner() {
      document.getElementById('authBanner').classList.remove('visible');
    }

    function detectImageAccess() {
      const probe = new Image();
      probe.onload = () => document.body.classList.remove('needs-school-auth');
      probe.onerror = () => {
        document.body.classList.add('needs-school-auth');
        document.getElementById('authBanner').classList.add('visible');
      };
      probe.src = DIRECT_IMG_URL;
    }

    const STUDENTS_DATA = [
      { id: 0, roman: "I", name: "", tag: "潮潮《咕嚕咕嚕魔法陣》", works: { poetry: [], novel: [], prose: [] } },
      { id: 1, roman: "II", name: "", tag: "小玉《櫻桃小丸子》", works: { poetry: [], novel: [], prose: [] } },
      { id: 2, roman: "III", name: "", tag: "田井中律《輕音少女》", works: { poetry: [], novel: [], prose: [] } },
      { id: 3, roman: "IV", name: "", tag: "天野陽菜《天氣之子》", works: { poetry: [], novel: [], prose: [] } },
      { id: 4, roman: "V", name: " ", tag: "艾露莎·史卡雷特《魔導少年》", works: { poetry: [], novel: [], prose: [] } },
      {
        id: 5,
        roman: "VI",
        name: "",
        tag: "倫倫《咕嚕咕嚕魔法陣》",
        works: {
          poetry: [
            {
              title: "鳳攸東街",
              tagline: "",
              content: `高大的榕樹
屹立在筆直街道
長長鬍鬚
隨風輕輕飄搖
偶有幾顆果實
啪嗒 啪嗒
打落在
途人的額頭
仿若正偷偷數著
他們的腳步

叮噹 叮噹
下課鈴聲打響
整齊藍白校服
背著書包
迎著烈陽
直奔陰涼樹蔭
偶有幾顆榕樹果實
啪嗒 啪嗒
打落在
學生們的額頭
好似在傾聽
他們的歡聲笑語

噠噠 噠噠
有人快步走近
白色西裝 黑色皮鞋
公文包裡的手機震了一下
他沒有停下
有幾顆榕樹果實
啪嗒 啪嗒
打落在
男人的額頭
又落到平地上
嵌入鞋底
仿佛在提醒他
當心腳下的路

軋軋 軋軋
老伯推著輪椅
一步一步
緩緩走過
碾碎了數顆小果
長長的樹鬚
溫柔地撫過他光滑的頭頂
就像在叫他
慢點走
慢點走

哦哦 哦哦
噪鵑今日也飛上枝頭
放聲高歌
高大的榕樹
靜靜傾聽
隨著韻律搖動身體
偶有幾顆果實
啪嗒 啪嗒
打落在
途人的額頭
如同正偷偷數著
自己在鳳攸東街生活的日子`
            }
          ],
          novel: [],
          prose: []
        }
      }
    ];

    const CHAR_BG_POSITIONS = ['7.5%', '25.5%', '43%', '59%', '76.5%', '94.5%'];
    const ROMAN_NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];

    const charactersStage = document.getElementById('charactersStage');
    const portfolioOverlay = document.getElementById('portfolioOverlay');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const modalAuthorName = document.getElementById('modalAuthorName');
    const modalAuthorGenre = document.getElementById('modalAuthorGenre');
    const modalCharBg = document.getElementById('modalCharBg');
    const genreTabs = document.querySelectorAll('.genre-tab');
    const worksGrid = document.getElementById('worksGrid');
    const worksListContainer = document.getElementById('worksListContainer');
    const manuscriptReader = document.getElementById('manuscriptReader');
    const btnReaderBack = document.getElementById('btnReaderBack');
    const readerTitle = document.getElementById('readerTitle');
    const readerSubtitle = document.getElementById('readerSubtitle');
    const readerContent = document.getElementById('readerContent');

    let currentStudentId = null;
    let currentGenre = 'poetry';

    function renderMainStage() {
      charactersStage.innerHTML = STUDENTS_DATA.map((st) => {
        const hasName = st.name.trim().length > 0;
        const displayName = hasName ? st.name : `學生 ${st.roman}`;
        const displayTag = st.tag.trim().length > 0 ? st.tag : '文學研習生';

        return `
          <div class="char-card" data-index="${st.id}" role="button" aria-label="檢視學生 ${st.roman} 的作品集">
            <div class="char-visual"></div>
            <div class="card-auth-fallback">
              <div class="fallback-seal">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </div>
              <div class="fallback-title">校園限定立繪</div>
              <p class="fallback-desc">此畫像存於校內雲端<br>需使用學校電郵檢視</p>
              <button class="btn-card-login" onclick="event.stopPropagation(); switchSchoolAccount();">
                登入學校帳號
              </button>
            </div>
            <div class="char-gradient-scrim"></div>
            <div class="char-meta">
              <span class="char-numeral">${st.roman}</span>
              <h3 class="char-name ${hasName ? '' : 'is-empty'}">${displayName}</h3>
              <p class="char-tag">${displayTag}</p>
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.char-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.getAttribute('data-index'), 10);
          openPortfolio(idx);
        });
      });
    }

    function scrollToRandomCharacter() {
      if (window.innerWidth <= 860) {
        const cards = document.querySelectorAll('.char-card');
        if (cards.length > 0) {
          const randomIndex = Math.floor(Math.random() * cards.length);
          setTimeout(() => {
            cards[randomIndex].scrollIntoView({ behavior: 'auto', inline: 'center' });
          }, 50);
        }
      }
    }

    function openPortfolio(id) {
      currentStudentId = id;
      currentGenre = 'poetry';
      const student = STUDENTS_DATA[currentStudentId];
      
      const hasName = student.name.trim().length > 0;
      modalAuthorName.textContent = hasName ? student.name : `學生 ${student.roman}`;
      modalAuthorGenre.innerHTML = student.tag.trim().length > 0 ? student.tag : '文學研習生';

      modalCharBg.style.backgroundPositionX = CHAR_BG_POSITIONS[id] || '50%';

      genreTabs.forEach(t => t.classList.toggle('active', t.getAttribute('data-genre') === 'poetry'));

      showWorksList();
      renderWorks();

      portfolioOverlay.classList.add('active');
    }

    function renderWorks() {
      const student = STUDENTS_DATA[currentStudentId];
      const works = student.works[currentGenre] || [];

      if (works.length === 0) {
        worksGrid.innerHTML = `
          <div class="empty-state">
            <div class="empty-symbol"></div>
            <p class="empty-text">卷 冊 空 缺 尚 待 補 遺</p>
            <div class="empty-symbol"></div>
          </div>
        `;
        return;
      }

      worksGrid.innerHTML = works.map((w, idx) => {
        const chNum = ROMAN_NUMERALS[idx] || (idx + 1);
        return `
          <article class="work-item" data-work-idx="${idx}">
            <div class="work-numeral">Chapter ${chNum}</div>
            <h4 class="work-title">${w.title || '無題'}</h4>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.work-item').forEach(item => {
        item.addEventListener('click', () => {
          const idx = parseInt(item.getAttribute('data-work-idx'), 10);
          openReader(works[idx]);
        });
      });
    }

    function openReader(work) {
      worksListContainer.style.display = 'none';
      manuscriptReader.classList.add('active');
      readerTitle.textContent = work.title || '無題';
      readerSubtitle.textContent = work.tagline || '';
      readerContent.textContent = work.content || '';
      document.querySelector('.book-body').scrollTop = 0;
    }

    function showWorksList() {
      manuscriptReader.classList.remove('active');
      worksListContainer.style.display = 'block';
    }

    function closePortfolio() {
      portfolioOverlay.classList.remove('active');
      setTimeout(showWorksList, 600);
    }

    genreTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        genreTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentGenre = tab.getAttribute('data-genre');
        showWorksList();
        renderWorks();
      });
    });

    btnCloseModal.addEventListener('click', closePortfolio);
    btnReaderBack.addEventListener('click', showWorksList);

    portfolioOverlay.addEventListener('click', (e) => {
      if (e.target === portfolioOverlay) closePortfolio();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && portfolioOverlay.classList.contains('active')) {
        closePortfolio();
      }
    });

    const canvas = document.getElementById('goldDustCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class GoldParticle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.6;
        this.speedX = (Math.random() - 0.5) * 0.25;
        this.speedY = -Math.random() * 0.35 - 0.1;
        this.alpha = Math.random() * 0.5 + 0.15;
        this.fade = (Math.random() * 0.006 + 0.002) * (Math.random() > 0.5 ? 1 : -1);
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.alpha += this.fade;
        if (this.alpha <= 0.08 || this.alpha >= 0.65) this.fade = -this.fade;
        if (this.y < -10 || this.x < -10 || this.x > canvas.width + 10) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = 'rgba(232, 211, 158, 0.7)';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 36; i++) {
      particles.push(new GoldParticle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    // 初始化與驗證檢查
    function init() {
      renderMainStage();
      detectImageAccess();
      animateParticles();

      // 檢查 LocalStorage 是否已經有通過驗證的記錄
      if (localStorage.getItem('archivum_auth') === 'true') {
        const pwdSec = document.getElementById('pwd-section');
        const charStage = document.getElementById('charactersStage');
        pwdSec.style.display = 'none';
        charStage.style.display = '';
        
        // 延遲一點點時間等待 DOM 渲染完成後再捲動
        setTimeout(scrollToRandomCharacter, 100);
      }
    }

    // 啟動
    init();

  </script>
</body>
</html>
